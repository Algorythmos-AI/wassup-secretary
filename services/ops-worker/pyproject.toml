[project]
name = "wassup-ops-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "wassup-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # Migrations run from this image (Railway pre-deploy step), as the migrator role.
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
wassup-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_worker"]

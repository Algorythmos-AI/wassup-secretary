[alembic]
script_location = %(here)s/migrations
# The URL comes from WASSUP_MIGRATION_DATABASE_URL (never committed). See migrations/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s

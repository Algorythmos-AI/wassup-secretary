[project]
name = "wassup-cli"
version = "0.1.0"
description = "Operator CLI: inspect, export and (re)bind voice-agent configuration."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.27"]

[project.scripts]
wassup = "wassup_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wassup_cli"]

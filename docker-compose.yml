# Local development: Postgres + all services. No secrets here; copy .env.example to .env.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wassup
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  voice-gateway:
    build: { context: ., args: { SERVICE: voice-gateway } }
    environment: { WASSUP_ENVIRONMENT: local }
    ports: ["8081:8080"]
    depends_on: { postgres: { condition: service_healthy } }
  core-api:
    build: { context: ., args: { SERVICE: core-api } }
    environment: { WASSUP_ENVIRONMENT: local }
    ports: ["8082:8080"]
    depends_on: { postgres: { condition: service_healthy } }
  ops-worker:
    build: { context: ., args: { SERVICE: ops-worker } }
    environment: { WASSUP_ENVIRONMENT: local }
    ports: ["8083:8080"]
    depends_on: { postgres: { condition: service_healthy } }
